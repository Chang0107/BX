<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程式 B: 庫存管理 (LAN同步版)</title>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="/socket.io/socket.io.js"><\/script>');
        }
    </script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background-color: #f0f4f8; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .status-container { display: flex; gap: 10px; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .status-online { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-offline { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; }
        
        tr.detecting-row {
            background-color: #e8f5e9 !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        input.edit-input { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        
        .actions button { margin-right: 5px; padding: 5px 10px; cursor: pointer; border: none; border-radius: 3px; color: white; }
        .btn-delete { background-color: #e74c3c; }
        .btn-save { background-color: #27ae60; }
        
        .btn-group-bottom { display: flex; gap: 10px; margin-top: 10px; }
        .btn-clear { flex: 1; background-color: #e74c3c; padding: 10px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-clean-zero { flex: 1; background-color: #f39c12; padding: 10px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        
        .manual-add { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; border: 1px dashed #ccc; }
        .manual-add h3 { margin-top: 0; font-size: 16px; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>程式 B (多裝置同步版)</h2>
        <div class="status-container">
            <div id="detectorStatus" class="status-badge status-offline">📷 偵測端: 離線</div>
            <div id="serverStatus" class="status-badge status-offline">🌐 伺服器: 連線中...</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>來源</th>
                <th>物品名稱</th>
                <th>數量</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="inventoryList">
        </tbody>
    </table>
    
    <div class="btn-group-bottom">
        <button class="btn-clean-zero" onclick="cleanZeroItems()">🧹 清除數量為 0 的項目</button>
        <button class="btn-clear" onclick="smartReset()">⚠️ 智慧重置 (依目前畫面)</button>
    </div>

    <div class="manual-add">
        <h3>➕ 手動新增物品</h3>
        <div class="flex-row">
            <input type="text" id="manualName" placeholder="物品名稱" class="edit-input" style="width: 200px;">
            <input type="number" id="manualQty" placeholder="數量" class="edit-input">
            <button class="btn-save" onclick="addManualItem()">新增</button>
        </div>
    </div>
</div>

    <script>
        const SERVER_URL = window.location.origin;
        let socket;
        if (typeof io !== 'undefined') {
            socket = io(SERVER_URL);
        } else {
            alert("無法載入 Socket.io，請檢查伺服器連線。");
        }

    let inventory = [];

    // --- 連線管理 ---
    socket.on('connect', () => {
        updateServerStatus(true);
    });

    socket.on('disconnect', () => {
        updateServerStatus(false);
        updateDetectorStatus(false); // Server 斷了，偵測端肯定也連不上
    });
    
    // 監聽偵測端狀態
    socket.on('detector_status', (isConnected) => {
        const wasOffline = document.getElementById('detectorStatus').classList.contains('status-offline');
        
        updateDetectorStatus(isConnected);
        
        // 如果偵測端從離線變為在線 (重連)，自動觸發智慧重置
        if (isConnected && wasOffline) {
            console.log("偵測端重新連線，自動觸發智慧重置...");
            
            // 為了避免太快觸發導致狀態不穩，延遲一小段時間
            setTimeout(() => {
                // 不彈出確認視窗，直接執行
                socket.emit('smart_reset', []); 
                
                // 顯示通知
                const notification = document.createElement('div');
                notification.style.position = 'fixed';
                notification.style.top = '20px';
                notification.style.left = '50%';
                notification.style.transform = 'translateX(-50%)';
                notification.style.backgroundColor = '#27ae60';
                notification.style.color = 'white';
                notification.style.padding = '10px 20px';
                notification.style.borderRadius = '5px';
                notification.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
                notification.style.zIndex = '9999';
                notification.textContent = '📷 偵測端已重連，自動同步畫面物品...';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transition = 'opacity 0.5s';
                    setTimeout(() => document.body.removeChild(notification), 500);
                }, 3000);
            }, 500);
        }
    });

    function updateServerStatus(online) {
        const div = document.getElementById('serverStatus');
        if (online) {
            div.textContent = "🌐 伺服器: 線上";
            div.className = "status-badge status-online";
        } else {
            div.textContent = "🌐 伺服器: 離線";
            div.className = "status-badge status-offline";
        }
    }
    
    function updateDetectorStatus(online) {
        const div = document.getElementById('detectorStatus');
        if (online) {
            div.textContent = "📷 偵測端: 線上";
            div.className = "status-badge status-online";
        } else {
            div.textContent = "📷 偵測端: 離線";
            div.className = "status-badge status-offline";
        }
    }

    // --- 接收資料同步 ---
    socket.on('init_data', (data) => {
        inventory = data.inventory;
        updateDetectorStatus(data.isDetectorConnected);
        renderTable();
    });

    socket.on('update_data', (data) => {
        inventory = data;
        renderTable();
    });

    // --- 操作邏輯 ---
    function sendUpdate() {
        socket.emit('manual_update', inventory);
    }

    function addManualItem() {
        const name = document.getElementById('manualName').value;
        const qty = parseInt(document.getElementById('manualQty').value);

        if(name && qty > 0) {
            const existing = inventory.find(i => i.name === name);
            if(existing) {
                existing.quantity += qty;
                existing.lastUpdated = Date.now();
            } else {
                const t = Date.now();
                const importedAtDate = new Date(t);
                importedAtDate.setUTCMinutes(0, 0, 0);
                const importedAt = importedAtDate.toISOString();
                const exp = new Date(importedAtDate.getTime() + 7 * 86400000);
                exp.setUTCMinutes(0, 0, 0);
                inventory.push({
                    id: t,
                    name: name,
                    quantity: qty,
                    source: 'B端新增',
                    lastUpdated: t,
                    isDetecting: false,
                    lastDetectedQty: qty,
                    importedAt,
                    expirationDate: exp.toISOString(),
                    isEditing: false
                });
            }
            sendUpdate();
            document.getElementById('manualName').value = '';
            document.getElementById('manualQty').value = '';
        }
    }

    function deleteItem(id) {
        if(confirm('確定刪除?')) {
            inventory = inventory.filter(item => item.id !== id);
            sendUpdate();
        }
    }
    
    // [新增] 清除數量為 0
    function cleanZeroItems() {
        socket.emit('clean_zero');
    }
    
    // [修改] 智慧重置
    function smartReset() {
        const msg = "【智慧重置說明】\n\n1. 若偵測端 (PC.py) 連線中：\n   將清空現有資料，並要求偵測端重新發送目前畫面上的物品。\n\n2. 若偵測端離線：\n   將直接清空所有資料。\n\n確定要執行嗎？";
        if(confirm(msg)) {
            // 這裡不需要傳送 currentActiveItems，因為邏輯改在 Server 端處理
            // Server 會通知 PC.py 重送
            socket.emit('smart_reset', []); 
        }
    }

    function toggleEdit(id) {
        const item = inventory.find(i => i.id === id);
        if (item) {
            item.isEditing = !item.isEditing;
            renderTable();
        }
    }

    function saveEdit(id) {
        const item = inventory.find(i => i.id === id);
        if (item) {
            const nameInput = document.querySelector(`.edit-name-${id}`).value;
            const qtyInput = document.querySelector(`.edit-qty-${id}`).value;
            
            item.name = nameInput;
            item.quantity = parseInt(qtyInput);
            item.isEditing = false;
            sendUpdate();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryList');
        tbody.innerHTML = '';

        inventory.forEach(item => {
            const tr = document.createElement('tr');
            
            if (item.isDetecting) {
                tr.classList.add('detecting-row');
            }

            const statusText = item.isDetecting ? 
                '<span style="color:#27ae60; font-weight:bold;">⚡ 偵測中...</span>' : 
                '<span style="color:#95a5a6;">靜止</span>';
            
            if (item.isEditing) {
                tr.innerHTML = `
                    <td><small>${item.source}</small></td>
                    <td><input type="text" class="edit-input edit-name-${item.id}" value="${item.name}"></td>
                    <td><input type="number" class="edit-input edit-qty-${item.id}" value="${item.quantity}"></td>
                    <td>編輯中</td>
                    <td class="actions">
                        <button class="btn-save" onclick="saveEdit(${item.id})">儲存</button>
                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td><small style="color: #888;">${item.source}</small></td>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${statusText}</td>
                    <td class="actions">
                        <button style="background:#f39c12" onclick="toggleEdit(${item.id})">修改</button>
                        <button class="btn-delete" onclick="deleteItem(${item.id})">刪除</button>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
